[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vestara-app"
version = "1.0.0"
description = "Goal-first investment planning platform for Indonesia"
requires-python = ">=3.10"
dependencies = [
    "streamlit==1.44.1",
    "pandas==2.2.3",
    "numpy==2.2.3",
    "scikit-learn",
    "scipy",
    "requests==2.32.3",
    "beautifulsoup4==4.14.3",
    "urllib3==2.4.0",
    "rich==13.9.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["vestara*"]
